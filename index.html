<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ritext</title>

<!-- Современные веб-шрифты для форматирования выделенного текста -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@400;500;600&family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600&family=Sora:wght@400;500;600&family=Fraunces:opsz,wght@9..144,400;9..144,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <header class="app-header">
    <div class="header-left">
      <h1 class="logo">ritext</h1>
      <button class="btn btn-ghost" id="expandBtn" type="button" data-i18n-aria="expandAriaOn" aria-label="Развернуть поле текста на весь экран">
        <span class="expand-icon" id="expandIcon">⤢</span> <span id="expandLabel" data-i18n="expand">Во весь экран</span>
      </button>
      <button class="btn btn-ghost" id="themeToggle" type="button" data-i18n-aria="themeAria" aria-label="Переключить тему">
        <span id="themeLabel" data-i18n="themeLight">Светлая тема</span>
      </button>

      <div class="tone-wrap">
        <button class="btn btn-ghost" id="toneBtn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="tonePopover">
          <span class="tone-dot" id="toneDot" aria-hidden="true"></span> <span data-i18n="toneBtn">Выбрать тон</span>
        </button>

        <div class="tone-popover" id="tonePopover" role="dialog" data-i18n-aria="tonePopAria" aria-label="Выбор тона интерфейса">
          <div class="tone-title" data-i18n="toneTitle">Тон интерфейса</div>
          <div class="tone-grid" id="toneGrid" role="radiogroup" data-i18n-aria="toneGridAria" aria-label="Готовые тона">
            <!-- готовые тона генерируются в script.js -->
          </div>
          <label class="tone-custom-row" for="toneCustom">
            <span class="tone-swatch tone-custom" id="toneCustomSwatch">
              <input type="color" id="toneCustom" value="#ff9500" data-i18n-aria="toneCustom" aria-label="Свой цвет">
            </span>
            <span class="tone-custom-text" data-i18n="toneCustom">Свой цвет</span>
          </label>
        </div>
      </div>

      <button class="btn btn-ghost" id="animateBtn" type="button" aria-pressed="false" aria-disabled="true">
        <span id="animateLabel" data-i18n="animate">Анимировать</span>
      </button>
    </div>

    <div class="header-right">
      <!-- Язык интерфейса сайта (не путать с переводом текста в редакторе) -->
      <div class="site-lang-wrap">
        <button class="btn btn-ghost site-lang-btn" id="siteLangBtn" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="siteLangMenu" data-i18n-aria="siteLangAria" aria-label="Язык сайта">
          <svg class="site-lang-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="9"></circle>
            <path d="M3 12h18"></path>
            <path d="M12 3c2.6 2.5 3.9 5.5 3.9 9s-1.3 6.5-3.9 9c-2.6-2.5-3.9-5.5-3.9-9S9.4 5.5 12 3z"></path>
          </svg>
          <span class="site-lang-name" id="siteLangName">Русский</span>
          <span class="caret" aria-hidden="true">▾</span>
        </button>
        <ul class="dropdown-menu" id="siteLangMenu" role="listbox" data-i18n-aria="siteLangAria" aria-label="Язык сайта"></ul>
      </div>

      <div class="export-bar" data-i18n-aria="exportAria" aria-label="Экспорт документа">
        <span class="export-label" data-i18n="exportLabel">Экспорт</span>
        <button class="btn btn-ghost" id="exportTxt" type="button">TXT</button>
        <button class="btn btn-ghost" id="exportPdf" type="button">PDF</button>
        <button class="btn btn-ghost" id="exportDocx" type="button">DOCX</button>
      </div>
    </div>
  </header>

  <main class="workspace">

    <!-- Левая рабочая область: алфавит + редактор -->
    <section class="editor-column">

      <div class="alphabet" id="alphabet" data-i18n-aria="alphabetAria" aria-label="Русский алфавит">
        <!-- буквы генерируются в script.js -->
      </div>

      <div class="editor-panel" id="editorPanel">
        <div class="panel-toolbar">
          <div class="panel-actions fmt-inline">
            <button class="fmt-btn fmt-close is-hidden" id="closeExpandBtn" type="button" data-i18n-aria="closeFull" aria-label="Закрыть полноэкранный режим">✕</button>

            <button class="fmt-btn fmt-bold" id="fmtBold" type="button" data-i18n-aria="fmtBold" aria-label="Жирный">B</button>
            <button class="fmt-btn fmt-italic" id="fmtItalic" type="button" data-i18n-aria="fmtItalic" aria-label="Курсив">I</button>
            <button class="fmt-btn fmt-underline" id="fmtUnderline" type="button" data-i18n-aria="fmtUnderline" aria-label="Подчёркивание">U</button>

            <div class="fmt-divider"></div>

            <div class="fmt-font-wrap">
              <button class="fmt-btn" id="fmtFontBtn" type="button" data-i18n-aria="fmtFont" aria-label="Шрифт">Aa</button>
              <ul class="dropdown-menu" id="fontMenu"></ul>
            </div>

            <div class="fmt-divider"></div>

            <button class="fmt-btn" id="fmtSizeDown" type="button" data-i18n-aria="fmtSizeDown" aria-label="Уменьшить размер">A−</button>
            <button class="fmt-btn" id="fmtSizeUp" type="button" data-i18n-aria="fmtSizeUp" aria-label="Увеличить размер">A+</button>
          </div>

          <div class="panel-actions">
            <div class="lang-wrap">
              <button class="btn btn-ghost" id="langBtn" type="button" data-i18n="langBtn">Язык ▾</button>
              <ul class="dropdown-menu" id="langMenu">
                <li data-lang="ru" data-i18n="lang_ru">Русский язык</li>
                <li data-lang="en" data-i18n="lang_en">Английский язык</li>
                <li data-lang="lv" data-i18n="lang_lv">Латышский язык</li>
              </ul>
            </div>
            <button class="btn btn-ghost is-hidden" id="revertLangBtn" type="button" data-i18n="revertLang">Исходный язык</button>

            <button class="btn btn-ghost" id="undoBtn" type="button" data-i18n="undo">↺ Обратно</button>

            <button class="btn btn-ghost" id="copyInput" type="button" data-i18n="copy">Копировать</button>
            <button class="btn btn-ghost" id="clearInput" type="button" data-i18n="clear">Удалить</button>
          </div>
        </div>

        <div class="editor-wrap">
          <div
            class="editor"
            id="editor"
            contenteditable="true"
            data-i18n-placeholder="editorPlaceholder"
            data-placeholder="Начните печатать здесь…"
            spellcheck="false"
          ></div>
          <div class="page-guides" id="pageGuides" aria-hidden="true"></div>
        </div>
      </div>

    </section>

    <!-- Правая панель результата -->
    <section class="result-panel">
      <div class="panel-toolbar">
        <span class="panel-title" data-i18n="resultTitle">Транслит</span>
        <div class="panel-actions">
          <button class="btn btn-ghost" id="clearOutput" type="button" data-i18n="clear">Удалить</button>
          <button class="btn btn-primary" id="copyOutput" type="button" data-i18n="copy">Копировать</button>
        </div>
      </div>

      <div class="result-wrap">
        <div class="result" id="result" data-i18n-placeholder="resultPlaceholder" data-placeholder="Здесь появится транслит…"></div>
      </div>
    </section>

  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

</div>

<!-- Библиотеки только для экспорта в PDF/DOCX -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script src="script.js"></script>
</body>
</html>
